<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="OM-D Moment Icon">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#222731"/>
      <stop offset="100%" stop-color="#11141a"/>
    </linearGradient>
    <linearGradient id="prismGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f2efe9"/>
      <stop offset="55%" stop-color="#d8d3ca"/>
      <stop offset="100%" stop-color="#b4afa6"/>
    </linearGradient>
    <linearGradient id="leatherGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#292e38"/>
      <stop offset="100%" stop-color="#191d24"/>
    </linearGradient>
    <radialGradient id="glassGrad" cx="38%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#4e7ea6"/>
      <stop offset="45%" stop-color="#1e2d3d"/>
      <stop offset="100%" stop-color="#0b1016"/>
    </radialGradient>
  </defs>

  <!-- Opaque iOS-ready app tile base -->
  <rect width="512" height="512" fill="url(#bgGrad)"/>

  <!-- Subtle corner viewfinder crop marks -->
  <g stroke="#d58b43" stroke-width="4" stroke-linecap="round" opacity="0.45" fill="none">
    <path d="M56 92 V56 H92"/>
    <path d="M420 56 H456 V92"/>
    <path d="M56 420 V456 H92"/>
    <path d="M420 456 H456 V420"/>
  </g>

  <!-- Camera body leather lower shell -->
  <rect x="78" y="182" width="356" height="196" rx="22" fill="url(#leatherGrad)" stroke="#4c5360" stroke-width="3"/>

  <!-- Top champagne-silver plate + OM-D pentaprism hump -->
  <path d="M78 198
           C78 184 86 176 100 176
           H172
           L206 124
           C212 115 220 112 232 112
           H280
           C292 112 300 115 306 124
           L340 176
           H412
           C426 176 434 184 434 198
           V218
           H78 Z"
        fill="url(#prismGrad)"/>

  <!-- Shutter dial & top dial hints -->
  <rect x="110" y="160" width="38" height="16" rx="4" fill="#c7c2b9"/>
  <rect x="364" y="156" width="44" height="20" rx="5" fill="#c7c2b9"/>
  <rect x="336" y="162" width="22" height="14" rx="3" fill="#d58b43"/>

  <!-- Iconic pentaprism hot-shoe / ridge accent -->
  <rect x="234" y="128" width="44" height="8" rx="3" fill="#8b867d"/>

  <!-- Silver baseplate line -->
  <path d="M84 358 H428 V366 C428 373 422 378 415 378 H97 C90 378 84 373 84 366 Z" fill="#c8c3ba"/>

  <!-- Lens mount & barrel -->
  <circle cx="256" cy="284" r="88" fill="#171b22" stroke="#d9d4cb" stroke-width="8"/>
  <circle cx="256" cy="284" r="76" fill="#232832" stroke="#d58b43" stroke-width="3.5"/>
  <circle cx="256" cy="284" r="64" fill="url(#glassGrad)" stroke="#495465" stroke-width="2"/>

  <!-- Subtle optical glass reflections -->
  <ellipse cx="234" cy="260" rx="18" ry="10" transform="rotate(-32 234 260)" fill="#a8d1f0" opacity="0.55"/>
  <circle cx="278" cy="306" r="7" fill="#d58b43" opacity="0.6"/>
  <circle cx="256" cy="284" r="22" fill="none" stroke="#8cb6d9" stroke-width="1.5" opacity="0.35"/>

  <!-- Subtle red self-timer / lens release detail -->
  <circle cx="378" cy="248" r="7" fill="#d58b43"/>
</svg>
